# Workflow actions are SHA-pinned with a "# vX.Y.Z" comment; Dependabot
# updates both the SHA and the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types:
          - minor
          - patch
