# Build, lint, unit tests and a docs drift check. Acceptance tests (TF_ACC=1)
# need a live GNS3 server and are not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Provider unit tests and tfplugindocs drive the terraform CLI.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed:"
            echo "$out"
            exit 1
          fi

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: go test
        run: go test ./... -count=1 -timeout 10m

      # Same commands as `make docs`; fails if docs/ is out of date.
      - name: docs
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name gns3
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs validate --provider-name gns3
          git diff --exit-code docs/
          untracked="$(git ls-files --others --exclude-standard docs/)"
          if [ -n "$untracked" ]; then
            echo "docs/ has files not in git:"
            echo "$untracked"
            exit 1
          fi

      # Every relative link and image in the repo's .md files resolves, and every page under
      # docs/ and test/scenarios/ has an "Up:" line. Runs the Invoke-Build task, not a copy of it.
      - name: Test-Docs
        shell: pwsh
        run: |
          Install-Module InvokeBuild -RequiredVersion 5.14.23 -Scope CurrentUser -Force
          Invoke-Build Test-Docs

      # Validates .goreleaser.yml so a broken config fails here, not on a tag push.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
